name: 🚀 Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Build and deploy
    if: github.repository_owner == 'NotAFlightRisk'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tubespotting.peng.ly
    steps:
      - name: Check there's somewhere to deploy to
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing gets deployed"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.ready.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        if: steps.ready.outputs.go == 'true'
      - run: npm test
        if: steps.ready.outputs.go == 'true'
      - run: npm run build
        if: steps.ready.outputs.go == 'true'
        env:
          ADAPTER: cloudflare
          PUBLIC_PLAUSIBLE_SCRIPT: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Push it to Cloudflare
        if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Hand the Worker its TfL key
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: |
          if [ -z "$TFL_APP_KEY" ]; then
            echo "::notice::No TFL_APP_KEY secret, so TfL gets asked anonymously"
          else
            printf '%s' "$TFL_APP_KEY" | npx wrangler secret put TFL_APP_KEY
          fi

      - name: Check trains are moving
        if: steps.ready.outputs.go == 'true'
        run: |
          site=$(node -p "require('./package.json').homepage")
          for i in $(seq 1 20); do
            trains=$(curl -fsS "$site/api/live" | node -pe "JSON.parse(require('fs').readFileSync(0)).trains.length" 2>/dev/null || echo 0)
            if [ "$trains" -gt 0 ]; then
              echo "✅ [$site]($site) is tracking $trains trains" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "❌ [$site]($site) isn't getting trains from TfL" >> "$GITHUB_STEP_SUMMARY"
          exit 1
